{% extends 'layout.html' %}
{% block title %}Edit post page{% endblock %}
{% block h1 %} Edit post Id ={{post._id}}{% endblock %}
{% block main %}
    <h1> Edit Post</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="text" name="title" id="title" placeholder="Title of post..." value="{{post.title}}">
        <input type="content" name="content" id="content" placeholder="content...">
        <input type="submit" value="send post">
    </form>
{% endblock %}
